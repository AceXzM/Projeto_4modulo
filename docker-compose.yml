# 048
# Sobe MySQL, API e frontend com volume persistente e redes internas, publicando so o Nginx
services:
  mysql:
    image: mysql:8.4
    # ports:
    #   - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Configure DB_NAME no .env}
      MYSQL_USER: ${DB_USER:?Configure DB_USER no .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD no .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  backend:
    # ports:
    #   - "3000:3000"
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?Configure DB_NAME no .env}
      DB_USER: ${DB_USER:?Configure DB_USER no .env}
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no .env}
      DB_DIALECT: mysql
      DB_SYNC: "true"
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no .env}
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081,http://127.0.0.1:8081}
    networks:
      - application
      - database
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "${WEB_PORT:-8081}:80"
    networks:
      - public
      - application
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  public:
  application:
    internal: true
  database:
    internal: true



